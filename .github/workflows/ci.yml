name: Validate

on:
  pull_request:
  push:
    branches: [main, v2-aws-foundation, v3-interactive-ai]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run synth
      - run: node --check infra/lambda/reading.js
